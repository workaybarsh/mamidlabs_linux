name: Installer package

# Builds the Linux .deb package (together with the setup wizard) and uploads it to a
# GitHub Release under a fixed name (mamidlabs.deb). That way the
# releases/latest/download/mamidlabs.deb link in the README always downloads the
# latest version directly. The single source of the version is __version__ in
# mamidlabs/__init__.py.
#
# Branch and PR runs only build and upload an artifact; when a v* tag is pushed the
# tag is verified to match the version and the package is published to a GitHub
# Release, using the matching CHANGELOG.md section as the release notes.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - 'packaging/**'
      - 'mamidlabs/**'
      - 'scripts/**'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'EULA.txt'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - 'mamidlabs/**'
      - 'scripts/**'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'EULA.txt'
      - '.github/workflows/installer.yml'

jobs:
  package:
    name: Linux · .deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          VERSION="$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' mamidlabs/__init__.py | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "__version__ not found in mamidlabs/__init__.py" >&2
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/tags/v*)
              if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
                echo "Tag (${GITHUB_REF_NAME}) does not match the version (v${VERSION})" >&2
                exit 1
              fi
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the .deb
        run: bash packaging/linux/build-deb.sh --output dist

      - name: Fixed-name copy (direct download)
        run: cp dist/mamidlabs_*.deb dist/mamidlabs.deb

      - uses: actions/upload-artifact@v4
        with:
          name: mamidlabs-deb
          path: dist/mamidlabs.deb
          retention-days: 14

      - name: Publish the release (GitHub Release)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v$VERSION"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no [$VERSION] section" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/mamidlabs.deb --clobber
          else
            gh release create "$TAG" dist/mamidlabs.deb \
              --title "MamidLabs $VERSION" --notes-file release-notes.md --verify-tag \
              || {
                # A parallel run for the same tag may have created the release first
                # (HTTP 422 "Release.tag_name already exists"); overwrite if it exists.
                gh release view "$TAG" >/dev/null 2>&1 && \
                  gh release upload "$TAG" dist/mamidlabs.deb --clobber
              }
          fi
